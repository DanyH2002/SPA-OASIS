services:

  # Backend Laravel
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: spa_backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spa_network

  # Servidor para Laravel
  nginx:
    image: nginx:alpine
    container_name: spa_nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - spa_network

  # Frontend Angular
  frontend:
    image: node:22-alpine
    container_name: spa_frontend
    working_dir: /app
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      NG_ALLOWED_HOSTS: "localhost,127.0.0.1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: 
      - npm
      - start
      - --
      - --host
      - 0.0.0.0
      - --port
      - "4200"
      - --proxy-config
      - src/proxy.conf.json
      - --poll
      - "1000"
    networks:
      - spa_network

  # Base de datos PostgreSQL
  db:
    image: postgres:17-alpine
    container_name: spa_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spa_network

  # Tunel publico ngrok
  ngrok:
    image: ngrok/ngrok:latest
    container_name: spa_ngrok
    command:
      - http
      - frontend:4200
      - --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - spa_network
    profiles:
      - demo

networks:
  spa_network:
    driver: bridge

volumes:
  postgres_data:
  frontend_node_modules:
